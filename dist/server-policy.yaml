proxy-groups:
- name: Ai+
  type: url-test
  use:
  - subscription
  filter: (?i)(?:🇺🇸|美国|美國|united[ -]?states|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$))
  exclude-filter: (?i)(?:🇺🇳|剩余流量|流量剩余|到期时间|过期时间|重置时间|套餐提示|订阅信息|(?:^|[\s|_-])(?:expire|traffic|sync|reset|官网|套餐|订阅|更新|客服|网址)(?:[\s:：|_-]|$))
  url: https://chatgpt.com/cdn-cgi/trace
  interval: 300
  tolerance: 50
  lazy: true
  timeout: 8000
  max-failed-times: 2
  expected-status: 200
- name: 学术搜索
  type: select
  proxies:
  - Ai+
  - DIRECT
- name: 学术访问
  type: select
  proxies:
  - DIRECT
  - Ai+
