proxy-groups:
- name: PROXY
  type: url-test
  use:
  - subscription
  exclude-filter: (?i)(?:🇺🇳|剩余流量|流量剩余|距离下次重置|重置剩余|到期时间|过期时间|套餐到期|套餐提示|订阅信息|(?:^|[\s|_\-【】()（）])(?:expire|traffic|sync|reset|官网|套餐|订阅|更新|客服|网址)(?:[\s:：|_\-\d【】()（）]|$)|(?:到期|过期|重置)[:：\s_|-]*\d{4}|剩余[:：\s_|-]*\d)
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: Ai稳定选择
  type: select
  use:
  - subscription
  exclude-filter: (?i)(?:🇺🇳|剩余流量|流量剩余|距离下次重置|重置剩余|到期时间|过期时间|套餐到期|套餐提示|订阅信息|(?:^|[\s|_\-【】()（）])(?:expire|traffic|sync|reset|官网|套餐|订阅|更新|客服|网址)(?:[\s:：|_\-\d【】()（）]|$)|(?:到期|过期|重置)[:：\s_|-]*\d{4}|剩余[:：\s_|-]*\d)
  filter: (?i)(?:🇺🇸|美国|美國|america|united[ -]?states|u\.s\.a\.?|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$))
- name: Ai测速备用
  type: url-test
  use:
  - subscription
  exclude-filter: (?i)(?:🇺🇳|剩余流量|流量剩余|距离下次重置|重置剩余|到期时间|过期时间|套餐到期|套餐提示|订阅信息|(?:^|[\s|_\-【】()（）])(?:expire|traffic|sync|reset|官网|套餐|订阅|更新|客服|网址)(?:[\s:：|_\-\d【】()（）]|$)|(?:到期|过期|重置)[:：\s_|-]*\d{4}|剩余[:：\s_|-]*\d)
  filter: (?i)(?:🇺🇸|美国|美國|america|united[ -]?states|u\.s\.a\.?|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$))
  url: https://chatgpt.com/cdn-cgi/trace
  interval: 300
  tolerance: 50
  lazy: true
  timeout: 8000
  max-failed-times: 2
  expected-status: 200
- name: Ai+
  type: select
  proxies:
  - Ai稳定选择
  - Ai测速备用
- name: Dev+
  type: select
  use:
  - subscription
  exclude-filter: (?i)(?:🇺🇳|剩余流量|流量剩余|距离下次重置|重置剩余|到期时间|过期时间|套餐到期|套餐提示|订阅信息|(?:^|[\s|_\-【】()（）])(?:expire|traffic|sync|reset|官网|套餐|订阅|更新|客服|网址)(?:[\s:：|_\-\d【】()（）]|$)|(?:到期|过期|重置)[:：\s_|-]*\d{4}|剩余[:：\s_|-]*\d)
  filter: (?i)(?:🇭🇰|香港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|hkg|🇺🇸|美国|美國|america|united[ -]?states|u\.s\.a\.?|(?:^|[^a-z])(?:us|usa)(?:[^a-z]|$))
  proxies:
  - PROXY
- name: 学术搜索
  type: select
  proxies:
  - Ai+
  - DIRECT
- name: 学术访问
  type: select
  proxies:
  - DIRECT
  - Ai+
