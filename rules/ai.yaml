payload:
  # ChatGPT core and its shared Cloudflare verification path. Keeping these
  # together prevents the page and its challenge from using different exits.
  - DOMAIN-SUFFIX,chatgpt.com
  - DOMAIN-SUFFIX,openai.com
  - DOMAIN-SUFFIX,oaistatic.com
  - DOMAIN-SUFFIX,oaiusercontent.com
  - DOMAIN-SUFFIX,oaistatsig.com
  - DOMAIN-SUFFIX,openai.fm
  - DOMAIN-SUFFIX,sora.com
  - DOMAIN-SUFFIX,challenges.cloudflare.com

  # Academic and research services that work more reliably through an AI-safe node
  - DOMAIN-SUFFIX,sagepub.com
  - DOMAIN,gene-structure.vercel.app
  - DOMAIN-SUFFIX,synapse.org
  - DOMAIN,repo-prod.prod.sagebase.org
  - DOMAIN-SUFFIX,alphafoldserver.com

  # Google AI plus the rest of Google: one suffix covers gemini./aistudio./
  # bard./makersuite./accounts./ogs./colab./notebooklm./docs./drive. Scholar
  # keeps its own policy because Custom-Scholar is ordered above Custom-AI in
  # index.yml (mihomo is first-match, so the exact DOMAIN wins).
  - DOMAIN-SUFFIX,google.com
  - DOMAIN-SUFFIX,googleapis.com
  - DOMAIN-SUFFIX,deepmind.com
  - DOMAIN-SUFFIX,gstatic.com
  - DOMAIN-SUFFIX,googleusercontent.com
  - DOMAIN-SUFFIX,ggpht.com

  # Claude / Anthropic. claude.ai is the Anthropic primary domain and the web
  # app entry point; skipping it gets users redirected to
  # claude.com/app-unavailable-in-region. anthropic.com carries
  # api.anthropic.com, and claudeusercontent.com serves Claude file downloads.
  - DOMAIN-SUFFIX,claude.ai
  - DOMAIN-SUFFIX,claude.com
  - DOMAIN-SUFFIX,anthropic.com
  - DOMAIN-SUFFIX,claudeusercontent.com

  # Grok / X
  - DOMAIN-SUFFIX,grok.com
  - DOMAIN-SUFFIX,x.ai
  - DOMAIN-SUFFIX,x.com

  # Other AI services and chat assistants
  - DOMAIN-SUFFIX,perplexity.ai
  - DOMAIN-SUFFIX,poe.com
  - DOMAIN-SUFFIX,nemoarchive.org
