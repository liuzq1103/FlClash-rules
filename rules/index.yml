rule-sets:
  # Priority is top-to-bottom. Keep REJECT before AI, and AI exceptions before DIRECT.
  - name: Custom-Reject
    file: reject.yaml
    target: REJECT
  - name: Custom-AI
    file: ai.yaml
    target: Ai+
  - name: Custom-Scholar
    file: scholar.yaml
    target: 学术搜索
  - name: Custom-Academic
    file: academic.yaml
    target: 学术访问
  - name: Custom-Tailscale
    file: tailscale.yaml
    target: DIRECT
  - name: Custom-Direct
    file: direct.yaml
    target: DIRECT

# ChatGPT and the shared Cloudflare verification endpoint must stay on Ai+.
# Academic sites use a separate DIRECT-first selector so a temporary challenge
# can be handled by switching only 学术访问 to Ai+.
route-constraints:
  - name: chatgpt-cloudflare-route
    target: Ai+
    rules:
      - DOMAIN-SUFFIX,challenges.cloudflare.com
      - DOMAIN-SUFFIX,chatgpt.com
      - DOMAIN-SUFFIX,openai.com
      - DOMAIN-SUFFIX,oaistatic.com
      - DOMAIN-SUFFIX,oaiusercontent.com
  - name: academic-direct-with-proxy-backup
    target: 学术访问
    rules:
      - DOMAIN-SUFFIX,science.org
      - DOMAIN-SUFFIX,pnas.org
      - DOMAIN-SUFFIX,oup.com
      - DOMAIN-SUFFIX,tandfonline.com
      - DOMAIN-SUFFIX,cell.com
