rule-sets:
  # Priority is top-to-bottom. Keep REJECT before AI, and AI exceptions before DIRECT.
  - name: Custom-Reject
    file: reject.yaml
    target: REJECT
  - name: Custom-AI
    file: ai.yaml
    target: Ai+
  - name: Custom-Scholar
    file: scholar.yaml
    target: 学术搜索
  - name: Custom-Academic
    file: academic.yaml
    target: DIRECT
  - name: Custom-Tailscale
    file: tailscale.yaml
    target: DIRECT
  - name: Custom-Direct
    file: direct.yaml
    target: DIRECT

# These related requests must use one policy group. Moving only the main site
# back to DIRECT would split Cloudflare's session across different exit IPs.
route-constraints:
  - name: cloudflare-session-affinity
    target: Ai+
    rules:
      - DOMAIN-SUFFIX,challenges.cloudflare.com
      - DOMAIN-SUFFIX,science.org
      - DOMAIN-SUFFIX,pnas.org
      - DOMAIN-SUFFIX,oup.com
      - DOMAIN-SUFFIX,tandfonline.com
      - DOMAIN-SUFFIX,cell.com
  - name: chatgpt-core
    target: Ai+
    rules:
      - DOMAIN-SUFFIX,chatgpt.com
      - DOMAIN-SUFFIX,openai.com
      - DOMAIN-SUFFIX,oaistatic.com
      - DOMAIN-SUFFIX,oaiusercontent.com
