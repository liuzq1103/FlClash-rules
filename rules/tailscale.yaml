# WARNING for shared servers: the CGNAT rule below forces the whole
# 100.64.0.0/10 range to DIRECT. On a multi-user Linux server this can
# interfere with other users' Tailscale traffic; confirm it is safe there,
# or remove the two IP rules (keep the domain rules) when not needed.
# This repository primarily targets single-user Windows/macOS desktops,
# where forcing Tailscale traffic direct is the desired behavior.
payload:
  # Tailscale control plane, DERP relays and MagicDNS names
  - DOMAIN-SUFFIX,tailscale.com
  - DOMAIN-SUFFIX,tailscale.io
  - DOMAIN-SUFFIX,ts.net

  # Tailnet IPv4 and IPv6 address spaces
  - IP-CIDR,100.64.0.0/10,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,no-resolve
